name: CI and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test Rust and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch locked dependencies
        run: cargo +stable fetch --locked

      - name: Run release tests
        run: |
          cargo +stable test --release --offline --all-targets
          cargo +stable test --release --offline --all-targets --features image-files
          cargo +stable test --release --offline --doc --features image-files
          cargo +stable test --release --offline --all-targets --no-default-features --features dim-128,simd
          cargo +stable test --release --offline --all-targets --no-default-features --features dim-64

      - name: Encode an RGB frame with the CLI
        run: |
          dd if=/dev/zero of="$RUNNER_TEMP/frame.rgb" bs=49152 count=1 status=none
          cargo +stable run --release --offline --example nano_rgb -- "$RUNNER_TEMP/frame.rgb" "$RUNNER_TEMP/embedding.f32"
          test "$(wc -c < "$RUNNER_TEMP/embedding.f32")" -eq 1024

      - name: Verify the installed Python wheel against the Rust CLI
        run: |
          cargo +stable build --release --locked --offline --features image-files --bin nano_image
          python3 -m venv "$RUNNER_TEMP/python-api"
          py="$RUNNER_TEMP/python-api/bin/python"
          "$py" -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/wheels"
          "$py" -m pip install "$RUNNER_TEMP"/wheels/visers-*.whl
          VISERS_NANO_CLI="$PWD/target/release/nano_image" "$py" -m unittest discover -s bindings/python/tests -v

  python-packages:
    if: github.event_name == 'push'
    uses: ./.github/workflows/python-packages.yml

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, python-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch locked dependencies
        run: cargo +stable fetch --locked

      - name: Package the Linux x86-64 CLI
        run: |
          version=$(cargo +stable metadata --offline --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "visers-nano") | .version')
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG must match Cargo version v$version" >&2
            exit 1
          fi

          cargo +stable build --release --offline --example nano_rgb
          package="$RUNNER_TEMP/package"
          archive="$RUNNER_TEMP/visers-nano-$TAG-linux-x86_64.tar.gz"
          mkdir -p "$package"
          install -m 755 target/release/examples/nano_rgb "$package/nano_rgb"
          install -m 644 LICENSE "$package/LICENSE"
          tar -czf "$archive" -C "$package" nano_rgb LICENSE
          echo "RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-dist-*
          path: ${{ runner.temp }}/python-dist
          merge-multiple: true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(
            "$RELEASE_ARCHIVE"
            assets/pareto-speed-quality.png
            assets/domain-comparison.png
            assets/nano-throughput-profile.png
            "$RUNNER_TEMP"/python-dist/*.whl
            "$RUNNER_TEMP"/python-dist/*.tar.gz
          )
          if published_assets=$(gh release view "$TAG" --json assets --jq '.assets[].name'); then
            for file in "${files[@]}"; do
              if ! grep -Fxq "$(basename "$file")" <<< "$published_assets"; then
                gh release upload "$TAG" "$file"
              fi
            done
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --notes-from-tag --title "Visers $TAG"
          fi

  pypi:
    name: Publish visers to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/visers/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
