[workspace]
members = ["bindings/python"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "1.1.1"
repository = "https://github.com/0himera/visers"

[package]
name = "visers-nano"
version.workspace = true
edition = "2021"
description = "Sub-millisecond zero-allocation CPU visual embedding engine with compile-time baked W8 Matryoshka weights"
license = "Apache-2.0"
repository.workspace = true

[features]
default = ["dim-256", "simd"]
dim-64 = []
dim-128 = []
dim-256 = []
simd = []
image-files = [
    "dep:fast_image_resize", "dep:image", "dep:libwebp-sys", "dep:same-file",
    "dep:tempfile", "dep:thiserror", "dep:turbojpeg",
]

[dependencies]
fast_image_resize = { version = "6.2", optional = true }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "png", "pnm", "webp"], optional = true }
libwebp-sys = { version = "0.14.5", default-features = false, features = ["std"], optional = true }
same-file = { version = "1", optional = true }
tempfile = { version = "3", default-features = false, optional = true }
thiserror = { version = "2", optional = true }
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake", "pkg-config"], optional = true }

[[bin]]
name = "nano_image"
path = "src/bin/nano_image.rs"
required-features = ["image-files"]

[[example]]
name = "nano_rgb"
path = "examples/nano_rgb.rs"
